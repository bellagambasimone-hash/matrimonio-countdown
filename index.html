<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Benedetta & Simone</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Great+Vibes&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(135deg, #ffd1dc, #ffb6c1, #ffc0cb);
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #333;
        }

        #hearts-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .heart {
            position: absolute;
            bottom: -50px;
            font-size: 24px;
            animation: floatUp linear infinite;
            opacity: 0.7;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 0.7; }
            100% { transform: translateY(-120vh) scale(1.5); opacity: 0; }
        }

        #main-content {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        /* STEP 1: Istruzioni e Luce Paradisiaca */
        #instruction {
            font-size: 1.2rem;
            font-weight: 600;
            color: #d81b60;
            transition: opacity 0.5s ease;
            margin-bottom: 50px;
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
        }

        /* Effetto Luce Celestiale */
        #light-portal {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 30%, rgba(255, 255, 255, 0.6) 60%, rgba(255, 255, 255, 0) 100%);
            box-shadow: 0 0 40px 20px rgba(255, 255, 255, 0.8), 0 0 80px 40px rgba(255, 255, 255, 0.4);
            cursor: pointer;
            margin: 0 auto;
            /* Animazione che fa pulsare la luce */
            animation: pulseLight 2s infinite alternate ease-in-out;
            /* Transizione per l'espansione al click */
            transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 1.5s ease;
        }

        @keyframes pulseLight {
            0% { transform: scale(0.9); box-shadow: 0 0 30px 15px rgba(255, 255, 255, 0.7), 0 0 60px 30px rgba(255, 255, 255, 0.3); }
            100% { transform: scale(1.15); box-shadow: 0 0 60px 30px rgba(255, 255, 255, 1), 0 0 120px 50px rgba(255, 255, 255, 0.7); }
        }

        /* Classe aggiunta al click: la luce esplode e svanisce */
        .light-open {
            animation: none !important;
            transform: scale(25) !important;
            opacity: 0;
        }

        /* STEP 2: Testo Corsivo */
        #cursive-text {
            font-family: 'Great Vibes', cursive;
            font-size: 2.8rem;
            color: #c2185b;
            min-height: 80px;
            text-shadow: 1px 1px 3px rgba(255,255,255,0.7);
        }

        /* STEP 3: Countdown */
        #countdown-container {
            background: rgba(255, 255, 255, 0.7);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            font-size: 1.2rem;
            font-weight: 600;
            color: #d81b60;
            backdrop-filter: blur(5px);
        }

        .time-box { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .time-unit { display: flex; flex-direction: column; align-items: center; width: 60px;}
        .time-value { font-size: 1.8rem; font-weight: bold; }
        .time-label { font-size: 0.8rem; text-transform: uppercase; }

        /* STEP 4: Testo Horror */
        #horror-text {
            font-family: 'Creepster', cursive;
            font-size: 2rem;
            color: #8b0000;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            margin-top: 20px;
            line-height: 1.2;
        }

        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 1s forwards; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="hearts-container"></div>

    <div id="main-content">
        <div id="step1">
            <p id="instruction">Tocca per proseguire</p>
            <div id="light-portal" onclick="openHeaven(event)"></div>
        </div>

        <div id="cursive-text"></div>

        <div id="countdown-container" class="hidden">
            <div>Mancano esattamente:</div>
            <div class="time-box">
                <div class="time-unit"><span id="days" class="time-value">0</span><span class="time-label">Giorni</span></div>
                <div class="time-unit"><span id="hours" class="time-value">0</span><span class="time-label">Ore</span></div>
                <div class="time-unit"><span id="minutes" class="time-value">0</span><span class="time-label">Min</span></div>
                <div class="time-unit"><span id="seconds" class="time-value">0</span><span class="time-label">Sec</span></div>
            </div>
        </div>

        <div id="horror-text" class="hidden">
            il countdown corre… tu un po’ meno 🫃🏻🤰🏼 FORZA! 🏃🏻‍➡️🏃🏼‍♀️‍➡️
        </div>
    </div>

    <script>
        function createHeart() {
            const container = document.getElementById('hearts-container');
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerText = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 4 + 4) + 's';
            heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
            
            container.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 8000);
        }
        setInterval(createHeart, 400);

        let currentStep = 0;

        // Funzione per espandere la luce
        function openHeaven(event) {
            event.stopPropagation(); 
            if (currentStep !== 0) return;
            currentStep = 1;

            document.getElementById('instruction').style.opacity = '0';
            
            // Aggiunge la classe che fa espandere la luce
            document.getElementById('light-portal').classList.add('light-open');

            // Aspetta che l'animazione della luce finisca
            setTimeout(() => {
                document.getElementById('step1').classList.add('hidden');
                typeWriter("Benedetta e Simone si sposeranno tra:", "cursive-text", 80, () => {
                    currentStep = 2; 
                });
            }, 1200);
        }

        function typeWriter(text, elementId, speed, callback) {
            let i = 0;
            let element = document.getElementById(elementId);
            element.innerHTML = "";
            
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                } else if (callback) {
                    callback();
                }
            }
            type();
        }

        let countdownInterval;
        function startCountdown() {
            const countDownDate = new Date("August 8, 2026 00:00:00").getTime();

            countdownInterval = setInterval(() => {
                const now = new Date().getTime();
                const distance = countDownDate - now;

                if (distance < 0) {
                    clearInterval(countdownInterval);
                    document.getElementById("countdown-container").innerHTML = "OGGI SI SPOSANO!";
                    return;
                }

                document.getElementById("days").innerText = Math.floor(distance / (1000 * 60 * 60 * 24));
                document.getElementById("hours").innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                document.getElementById("minutes").innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                document.getElementById("seconds").innerText = Math.floor((distance % (1000 * 60)) / 1000);
            }, 1000);
        }

        document.body.addEventListener('click', () => {
            if (currentStep === 2) {
                document.getElementById('countdown-container').classList.remove('hidden');
                document.getElementById('countdown-container').classList.add('fade-in');
                startCountdown();
                currentStep = 3;
            } else if (currentStep === 3) {
                document.getElementById('horror-text').classList.remove('hidden');
                document.getElementById('horror-text').classList.add('fade-in');
                currentStep = 4;
            }
        });

    </script>
</body>
</html>
