<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Matrimonio</title>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital@1&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    background: linear-gradient(to bottom, #ffffff, #f7e7e1);
    overflow: hidden;
    text-align: center;
    color: #5a3e36;
}

/* SFONDO LUMINOSO */
.bg-light {
    position: fixed;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.4) 40%, transparent 70%);
    z-index: 0;
}

/* START */
.start {
    position: fixed;
    width: 100%;
    height: 100%;
    background: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.5em;
    z-index: 10;
}

/* MANI REALISTICHE */
.hands {
    position: fixed;
    width: 100%;
    top: 35%;
    display: flex;
    justify-content: center;
    z-index: 2;
}

.hands img {
    width: 300px;
    transition: transform 2s ease, opacity 2s ease;
}

.open .hands img {
    transform: scale(0.8) translateY(-50px);
    opacity: 0;
}

/* CONTENUTO */
.content {
    display: none;
    position: relative;
    z-index: 3;
    padding-top: 25vh;
}

/* SCRITTA ELEGANTE */
h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 3.5em;
}

/* CURSORE */
.cursor {
    border-right: 2px solid #5a3e36;
    animation: blink 0.7s infinite;
}

@keyframes blink {
    50% { border-color: transparent; }
}

#countdown {
    font-size: 2em;
    margin: 20px 0;
}

.extra {
    font-style: italic;
    opacity: 0.7;
}

/* CUORI SOFT */
.heart {
    position: fixed;
    bottom: 0;
    color: rgba(232, 167, 167, 0.4);
    animation: float 8s linear infinite;
}

@keyframes float {
    0% { transform: translateY(0); opacity: 0; }
    30% { opacity: 1; }
    100% { transform: translateY(-120vh); opacity: 0; }
}
</style>
</head>

<body>

<div class="bg-light"></div>

<!-- AUDIO -->
<audio id="birds" src="https://www.soundjay.com/nature/sounds/birds-1.mp3" loop></audio>

<!-- START -->
<div class="start" id="start">
    Tocca per entrare 💍
</div>

<!-- MANI (IMMAGINE REALISTICA) -->
<div class="hands" id="hands">
    <img src="https://images.unsplash.com/photo-1522673607200-164d1b6ce486" alt="mani">
</div>

<!-- CONTENUTO -->
<div class="content" id="content">
    <h1 id="names"></h1>
    <div>si sposeranno tra</div>
    <div id="countdown"></div>
    <div class="extra">ps. sono i giorni che hai per dimagrire 😈</div>
</div>

<script>

// CLICK
document.getElementById("start").addEventListener("click", () => {

    document.body.classList.add("open");

    document.getElementById("birds").play().catch(()=>{});

    document.getElementById("start").style.display = "none";

    setTimeout(() => {
        document.getElementById("content").style.display = "block";
        typeText("Benedetta & Simone");
        startHearts();
    }, 2000);

});

// SCRITTURA PIÙ FLUIDA
function typeText(text) {
    let i = 0;
    const el = document.getElementById("names");

    const interval = setInterval(() => {
        el.innerHTML = text.substring(0, i) + '<span class="cursor"></span>';
        i++;
        if (i > text.length) {
            clearInterval(interval);
            el.innerHTML = text;
        }
    }, 70);
}

// COUNTDOWN
const targetDate = new Date("August 8, 2026 00:00:00").getTime();

function updateCountdown() {
    const now = new Date().getTime();
    const distance = targetDate - now;

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((distance / (1000 * 60)) % 60);
    const seconds = Math.floor((distance / 1000) % 60);

    document.getElementById("countdown").innerHTML =
        `${days} giorni ${hours} ore ${minutes} min ${seconds} sec`;
}

setInterval(updateCountdown, 1000);
updateCountdown();

// CUORI
function startHearts() {
    setInterval(() => {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤";

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (10 + Math.random() * 25) + "px";

        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 8000);
    }, 400);
}

</script>

</body>
</html>
