<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matrimonio</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: 'Montserrat', sans-serif;
    background: #000;
}

/* PORTE */
.door {
    position: fixed;
    top: 0;
    width: 50%;
    height: 100%;
    background: #5a3e36;
    z-index: 10;
    transition: transform 2s ease;
}

.left { left: 0; border-right: 2px solid #fff; }
.right { right: 0; border-left: 2px solid #fff; }

.open .left { transform: translateX(-100%); }
.open .right { transform: translateX(100%); }

/* LUCE */
.light {
    position: fixed;
    width: 100%;
    height: 100%;
    background: white;
    opacity: 0;
    z-index: 9;
    transition: opacity 1.5s ease;
}

.show-light { opacity: 1; }

/* CONTENUTO */
.content {
    position: relative;
    z-index: 1;
    color: #5a3e36;
    text-align: center;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0;
    transition: opacity 2s ease;
    padding: 20px;
}

.show-content {
    opacity: 1;
}

h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 3em;
}

/* effetto scrittura */
.typing {
    border-right: 2px solid #5a3e36;
    white-space: nowrap;
    overflow: hidden;
    width: 0;
    animation: typing 3s steps(30, end) forwards, blink 0.7s infinite;
}

@keyframes typing {
    from { width: 0 }
    to { width: 100% }
}

@keyframes blink {
    50% { border-color: transparent }
}

.date {
    margin: 10px 0;
    font-size: 1.2em;
}

#countdown {
    font-size: 2em;
    margin: 20px 0;
}

.extra {
    font-style: italic;
    opacity: 0.8;
}

/* CUORI */
.heart {
    position: fixed;
    color: #e8a7a7;
    font-size: 20px;
    animation: float 6s linear infinite;
}

@keyframes float {
    0% { transform: translateY(100vh); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
}
</style>
</head>

<body>

<!-- AUDIO CAMPANE -->
<audio id="bells" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"></audio>

<!-- PORTE -->
<div class="door left"></div>
<div class="door right"></div>

<!-- LUCE -->
<div class="light" id="light"></div>

<!-- CONTENUTO -->
<div class="content" id="content">
    <h1 id="names" class="typing"></h1>
    <div class="date">si sposeranno tra</div>
    <div id="countdown"></div>
    <div class="extra">ps. sono i giorni che hai per dimagrire 😈</div>
</div>

<script>

// CLICK PER APRIRE
document.body.addEventListener("click", () => {
    document.body.classList.add("open");

    // suono campane
    const audio = document.getElementById("bells");
    audio.play().catch(() => {});

    setTimeout(() => {
        document.getElementById("light").classList.add("show-light");
    }, 800);

    setTimeout(() => {
        document.getElementById("content").classList.add("show-content");

        // scrittura nome
        document.getElementById("names").textContent = "Benedetta & Simone";

        startHearts();
    }, 2000);
}, { once: true });

// COUNTDOWN
const targetDate = new Date("August 8, 2026 00:00:00").getTime();

function updateCountdown() {
    const now = new Date().getTime();
    const distance = targetDate - now;

    if (distance <= 0) {
        document.getElementById("countdown").innerHTML = "Oggi è il grande giorno 💍";
        return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((distance / (1000 * 60)) % 60);
    const seconds = Math.floor((distance / 1000) % 60);

    document.getElementById("countdown").innerHTML =
        `${days} giorni ${hours} ore ${minutes} min ${seconds} sec`;
}

setInterval(updateCountdown, 1000);
updateCountdown();

// CUORI
function startHearts() {
    setInterval(() => {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤";

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (10 + Math.random() * 20) + "px";

        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 6000);
    }, 300);
}

</script>

</body>
</html>
