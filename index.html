<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Matrimonio</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: 'Montserrat', sans-serif;
    background: black;
}

/* PORTE REALISTICHE */
.door {
    position: fixed;
    top: 0;
    width: 50%;
    height: 100%;
    background: linear-gradient(to right, #4b2e2e, #7a4b4b);
    z-index: 10;
    transition: transform 2s ease;
}

.left { left: 0; transform-origin: left; }
.right { right: 0; transform-origin: right; }

.open .left { transform: rotateY(-90deg); }
.open .right { transform: rotateY(90deg); }

/* LUCE */
.light {
    position: fixed;
    width: 100%;
    height: 100%;
    background: white;
    opacity: 0;
    z-index: 9;
    transition: opacity 1.5s ease;
}

.show-light { opacity: 1; }
.hide-light { opacity: 0; }

/* CONTENUTO */
.content {
    position: relative;
    z-index: 1;
    color: #5a3e36;
    text-align: center;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0;
    transition: opacity 2s ease;
}

.show-content { opacity: 1; }

h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 3em;
}

/* scrittura vera */
.cursor {
    border-right: 2px solid #5a3e36;
    animation: blink 0.7s infinite;
}

@keyframes blink {
    50% { border-color: transparent }
}

.date {
    margin: 10px 0;
}

#countdown {
    font-size: 2em;
    margin: 20px 0;
}

.extra {
    font-style: italic;
    opacity: 0.8;
}
</style>
</head>

<body>

<audio id="bells" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"></audio>

<div class="door left"></div>
<div class="door right"></div>

<div class="light" id="light"></div>

<div class="content" id="content">
    <h1 id="names"></h1>
    <div class="date">si sposeranno tra</div>
    <div id="countdown"></div>
    <div class="extra">ps. sono i giorni che hai per dimagrire 😈</div>
</div>

<script>

// APERTURA
document.body.addEventListener("click", () => {
    document.body.classList.add("open");

    document.getElementById("bells").play().catch(()=>{});

    setTimeout(() => {
        document.getElementById("light").classList.add("show-light");
    }, 500);

    // TOGLIE LA LUCE → fondamentale
    setTimeout(() => {
        document.getElementById("light").classList.add("hide-light");
    }, 1800);

    setTimeout(() => {
        document.getElementById("content").classList.add("show-content");
        typeText("Benedetta & Simone");
    }, 2200);

}, { once: true });


// EFFETTO SCRITTURA (vero, non CSS finto)
function typeText(text) {
    let i = 0;
    const el = document.getElementById("names");
    el.innerHTML = "";

    const interval = setInterval(() => {
        el.innerHTML = text.substring(0, i) + '<span class="cursor"></span>';
        i++;
        if (i > text.length) {
            clearInterval(interval);
            el.innerHTML = text;
        }
    }, 100);
}


// COUNTDOWN
const targetDate = new Date("August 8, 2026 00:00:00").getTime();

function updateCountdown() {
    const now = new Date().getTime();
    const distance = targetDate - now;

    if (distance <= 0) {
        document.getElementById("countdown").innerHTML = "Oggi è il grande giorno 💍";
        return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((distance / (1000 * 60)) % 60);
    const seconds = Math.floor((distance / 1000) % 60);

    document.getElementById("countdown").innerHTML =
        `${days} giorni ${hours} ore ${minutes} min ${seconds} sec`;
}

setInterval(updateCountdown, 1000);
updateCountdown();

</script>

</body>
</html>
