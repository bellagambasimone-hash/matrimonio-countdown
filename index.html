<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Matrimonio</title>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    background: black;
    color: #5a3e36;
    text-align: center;
}

/* SCHERMATA INIZIALE */
.start {
    position: fixed;
    width: 100%;
    height: 100%;
    background: linear-gradient(#2c1b1b, #5a3e36);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.5em;
    color: white;
    z-index: 10;
}

/* CONTENUTO */
.content {
    display: none;
    padding-top: 30vh;
}

/* SCRITTA */
h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 3em;
}

/* CURSORE */
.cursor {
    border-right: 2px solid #5a3e36;
    animation: blink 0.7s infinite;
}

@keyframes blink {
    50% { border-color: transparent; }
}

#countdown {
    font-size: 2em;
    margin: 20px 0;
}

.extra {
    font-style: italic;
    opacity: 0.8;
}
</style>
</head>

<body>

<!-- AUDIO -->
<audio id="bells" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"></audio>

<!-- SCHERMATA CLICK -->
<div class="start" id="start">
    Tocca per entrare 💍
</div>

<!-- CONTENUTO -->
<div class="content" id="content">
    <h1 id="names"></h1>
    <div>si sposeranno tra</div>
    <div id="countdown"></div>
    <div class="extra">ps. sono i giorni che hai per dimagrire 😈</div>
</div>

<script>

// CLICK
document.getElementById("start").addEventListener("click", () => {

    // suono
    document.getElementById("bells").play().catch(()=>{});

    // nasconde start
    document.getElementById("start").style.display = "none";

    // mostra contenuto
    document.getElementById("content").style.display = "block";

    // scrittura nome
    typeText("Benedetta & Simone");

});

// SCRITTURA
function typeText(text) {
    let i = 0;
    const el = document.getElementById("names");

    const interval = setInterval(() => {
        el.innerHTML = text.substring(0, i) + '<span class="cursor"></span>';
        i++;
        if (i > text.length) {
            clearInterval(interval);
            el.innerHTML = text;
        }
    }, 80);
}

// COUNTDOWN
const targetDate = new Date("August 8, 2026 00:00:00").getTime();

function updateCountdown() {
    const now = new Date().getTime();
    const distance = targetDate - now;

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((distance / (1000 * 60)) % 60);
    const seconds = Math.floor((distance / 1000) % 60);

    document.getElementById("countdown").innerHTML =
        `${days} giorni ${hours} ore ${minutes} min ${seconds} sec`;
}

setInterval(updateCountdown, 1000);
updateCountdown();

</script>

</body>
</html>
