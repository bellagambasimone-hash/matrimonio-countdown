<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Benedetta & Simone</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Great+Vibes&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        /* Stili di base e Sfondo Romantico */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(135deg, #ffd1dc, #ffb6c1, #ffc0cb); /* Sfondo rosa romantico */
            font-family: 'Montserrat', sans-serif;
            overflow: hidden; /* Nasconde lo scorrimento */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #333;
        }

        /* Contenitore per i cuoricini animati */
        #hearts-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Impedisce che i cuori blocchino i tocchi */
            z-index: 1;
        }

        .heart {
            position: absolute;
            bottom: -50px;
            font-size: 24px;
            animation: floatUp linear infinite;
            opacity: 0.7;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 0.7; }
            100% { transform: translateY(-120vh) scale(1.5); opacity: 0; }
        }

        /* Contenitore principale (Sopra i cuori) */
        #main-content {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        /* STEP 1: Istruzioni e Cancello */
        #instruction {
            font-size: 1.2rem;
            font-weight: 600;
            color: #d81b60;
            transition: opacity 0.5s ease;
        }

        #gate-container {
            display: flex;
            justify-content: center;
            width: 200px;
            height: 150px;
            cursor: pointer;
            position: relative;
            perspective: 1000px;
        }

        .door {
            width: 50%;
            height: 100%;
            background: repeating-linear-gradient(90deg, transparent, transparent 15px, #4a4a4a 15px, #4a4a4a 20px);
            border: 4px solid #4a4a4a;
            border-bottom: none;
            transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 1.5s ease;
        }

        .left-door {
            border-radius: 20px 0 0 0;
            border-right: 2px solid #4a4a4a;
            transform-origin: left;
        }

        .right-door {
            border-radius: 0 20px 0 0;
            border-left: 2px solid #4a4a4a;
            transform-origin: right;
        }

        /* Animazione apertura cancello */
        .gate-open .left-door { transform: translateX(-150%) rotateY(-30deg); opacity: 0; }
        .gate-open .right-door { transform: translateX(150%) rotateY(30deg); opacity: 0; }

        /* STEP 2: Testo Corsivo */
        #cursive-text {
            font-family: 'Great Vibes', cursive;
            font-size: 2.8rem;
            color: #c2185b;
            min-height: 80px;
            text-shadow: 1px 1px 3px rgba(255,255,255,0.7);
        }

        /* STEP 3: Countdown */
        #countdown-container {
            background: rgba(255, 255, 255, 0.6);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            font-size: 1.2rem;
            font-weight: 600;
            color: #d81b60;
        }

        .time-box { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .time-unit { display: flex; flex-direction: column; align-items: center; width: 60px;}
        .time-value { font-size: 1.8rem; font-weight: bold; }
        .time-label { font-size: 0.8rem; text-transform: uppercase; }

        /* STEP 4: Testo Horror */
        #horror-text {
            font-family: 'Creepster', cursive;
            font-size: 2rem;
            color: #8b0000;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            margin-top: 20px;
            line-height: 1.2;
        }

        /* Classi di utilità */
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 1s forwards; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="hearts-container"></div>

    <div id="main-content">
        <div id="step1">
            <p id="instruction">Tocca per proseguire</p>
            <div id="gate-container" onclick="openGate(event)">
                <div class="door left-door"></div>
                <div class="door right-door"></div>
            </div>
        </div>

        <div id="cursive-text"></div>

        <div id="countdown-container" class="hidden">
            <div class="time-box">
                <div class="time-unit"><span id="days" class="time-value">0</span><span class="time-label">Giorni</span></div>
                <div class="time-unit"><span id="hours" class="time-value">0</span><span class="time-label">Ore</span></div>
                <div class="time-unit"><span id="minutes" class="time-value">0</span><span class="time-label">Min</span></div>
                <div class="time-unit"><span id="seconds" class="time-value">0</span><span class="time-label">Sec</span></div>
            </div>
        </div>

        <div id="horror-text" class="hidden">
            Il conto alla rovescia per i chili da perdere è iniziato buona fortuna
        </div>
    </div>

    <script>
        // Generatore di cuoricini animati continui
        function createHeart() {
            const container = document.getElementById('hearts-container');
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerText = '❤️';
            // Posizione orizzontale casuale
            heart.style.left = Math.random() * 100 + 'vw';
            // Durata animazione casuale (tra 4 e 8 secondi)
            heart.style.animationDuration = (Math.random() * 4 + 4) + 's';
            // Dimensione casuale
            heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
            
            container.appendChild(heart);
            
            // Rimuove il cuoricino dopo che è uscito dallo schermo per non appesantire la memoria
            setTimeout(() => { heart.remove(); }, 8000);
        }
        setInterval(createHeart, 400); // Crea un cuore ogni 400ms

        // Variabile per gestire i vari tap sullo schermo
        let currentStep = 0;

        // Funzione STEP 1: Aprire il cancello
        function openGate(event) {
            // Impedisce che il click sul cancello venga contato anche come tap sullo schermo
            event.stopPropagation(); 
            
            if (currentStep !== 0) return;
            currentStep = 1;

            // Nasconde la scritta "Tocca per proseguire"
            document.getElementById('instruction').style.opacity = '0';
            
            // Applica la classe per aprire il cancello
            document.getElementById('gate-container').classList.add('gate-open');

            // Aspetta 1.5 secondi per far finire l'animazione, poi nasconde il cancello e scrive il testo
            setTimeout(() => {
                document.getElementById('step1').classList.add('hidden');
                typeWriter("Benedetta e Simone si sposeranno tra", "cursive-text", 80, () => {
                    // Quando finisce di scrivere, permette di passare allo step successivo
                    currentStep = 2; 
                });
            }, 1500);
        }

        // Effetto "Macchina da scrivere" per il testo corsivo
        function typeWriter(text, elementId, speed, callback) {
            let i = 0;
            let element = document.getElementById(elementId);
            element.innerHTML = "";
            
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                } else if (callback) {
                    callback();
                }
            }
            type();
        }

        // Funzione per il Countdown
        let countdownInterval;
        function startCountdown() {
            // Data del matrimonio: 8 Agosto 2026 a mezzanotte
            const countDownDate = new Date("August 8, 2026 16:00:00").getTime();

            countdownInterval = setInterval(() => {
                const now = new Date().getTime();
                const distance = countDownDate - now;

                if (distance < 0) {
                    clearInterval(countdownInterval);
                    document.getElementById("countdown-container").innerHTML = "OGGI SI SPOSANO!";
                    return;
                }

                document.getElementById("days").innerText = Math.floor(distance / (1000 * 60 * 60 * 24));
                document.getElementById("hours").innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                document.getElementById("minutes").innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                document.getElementById("seconds").innerText = Math.floor((distance % (1000 * 60)) / 1000);
            }, 1000);
        }

        // Gestione dei tap successivi in qualsiasi punto dello schermo
        document.body.addEventListener('click', () => {
            if (currentStep === 2) {
                // STEP 3: Mostra il Countdown
                document.getElementById('countdown-container').classList.remove('hidden');
                document.getElementById('countdown-container').classList.add('fade-in');
                startCountdown();
                currentStep = 3;
            } else if (currentStep === 3) {
                // STEP 4: Mostra il Testo Horror
                document.getElementById('horror-text').classList.remove('hidden');
                document.getElementById('horror-text').classList.add('fade-in');
                currentStep = 4;
            }
        });

    </script>
</body>
</html>
