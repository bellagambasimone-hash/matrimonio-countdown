<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Matrimonio</title>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital@1&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    background: #fdf6f0;
    overflow: hidden;
    text-align: center;
    color: #5a3e36;
}

/* SCHERMATA INIZIALE */
.start {
    position: fixed;
    width: 100%;
    height: 100%;
    background: #fdf6f0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.5em;
    z-index: 10;
}

/* MANI */
.hands {
    position: fixed;
    width: 100%;
    top: 40%;
    display: flex;
    justify-content: space-between;
    padding: 0 10%;
    font-size: 3em;
    opacity: 1;
    transition: all 2s ease;
}

.hands span {
    transition: transform 2s ease;
}

.open .left-hand {
    transform: translateX(-200px);
}

.open .right-hand {
    transform: translateX(200px);
}

/* CONTENUTO */
.content {
    display: none;
    padding-top: 25vh;
}

/* SCRITTA */
h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 3.2em;
}

/* CURSORE */
.cursor {
    border-right: 2px solid #5a3e36;
    animation: blink 0.7s infinite;
}

@keyframes blink {
    50% { border-color: transparent; }
}

#countdown {
    font-size: 2em;
    margin: 20px 0;
}

.extra {
    font-style: italic;
    opacity: 0.7;
}

/* CUORI */
.heart {
    position: fixed;
    bottom: 0;
    color: rgba(232, 167, 167, 0.5);
    animation: float 6s linear infinite;
}

@keyframes float {
    0% { transform: translateY(0); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateY(-100vh); opacity: 0; }
}
</style>
</head>

<body>

<!-- AUDIO UCCELLINI -->
<audio id="birds" src="https://www.soundjay.com/nature/sounds/birds-1.mp3" loop></audio>

<!-- START -->
<div class="start" id="start">
    Tocca per entrare 💍
</div>

<!-- MANI -->
<div class="hands" id="hands">
    <span class="left-hand">🤝</span>
    <span class="right-hand">🤝</span>
</div>

<!-- CONTENUTO -->
<div class="content" id="content">
    <h1 id="names"></h1>
    <div>si sposeranno tra</div>
    <div id="countdown"></div>
    <div class="extra">ps. sono i giorni che hai per dimagrire 😈</div>
</div>

<script>

// CLICK
document.getElementById("start").addEventListener("click", () => {

    document.body.classList.add("open");

    document.getElementById("birds").play().catch(()=>{});

    document.getElementById("start").style.display = "none";

    setTimeout(() => {
        document.getElementById("hands").style.opacity = "0";
    }, 1500);

    setTimeout(() => {
        document.getElementById("content").style.display = "block";
        typeText("Benedetta & Simone");
        startHearts();
    }, 1800);

});

// SCRITTURA MIGLIORATA
function typeText(text) {
    let i = 0;
    const el = document.getElementById("names");

    const interval = setInterval(() => {
        el.innerHTML = text.substring(0, i) + '<span class="cursor"></span>';
        i++;
        if (i > text.length) {
            clearInterval(interval);
            el.innerHTML = text;
        }
    }, 80);
}

// COUNTDOWN
const targetDate = new Date("August 8, 2026 00:00:00").getTime();

function updateCountdown() {
    const now = new Date().getTime();
    const distance = targetDate - now;

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((distance / (1000 * 60)) % 60);
    const seconds = Math.floor((distance / 1000) % 60);

    document.getElementById("countdown").innerHTML =
        `${days} giorni ${hours} ore ${minutes} min ${seconds} sec`;
}

setInterval(updateCountdown, 1000);
updateCountdown();

// CUORI
function startHearts() {
    setInterval(() => {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤";

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (10 + Math.random() * 20) + "px";

        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 6000);
    }, 300);
}

</script>

</body>
</html>
